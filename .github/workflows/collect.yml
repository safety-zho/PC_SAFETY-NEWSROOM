name: 뉴스 수집

on:
  schedule:
    # 한국 시간 평일 8시~18시 매시간 (GitHub는 UTC 기준이라 9시간을 뺌)
    - cron: "7 23 * * 0-4"   # 월~금 08:07 KST
    - cron: "7 0-9 * * 1-5"  # 월~금 09:07~18:07 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 기사 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_API: ${{ secrets.NAVER_API }}
        run: python collect.py

      - name: 변경 사항 저장
        run: |
          if git diff --quiet -- data/news.json; then
            echo "새 기사 없음"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news.json
          git commit -m "뉴스 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
