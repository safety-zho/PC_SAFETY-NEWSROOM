<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>안전보건 뉴스룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 상단(제목·핵심 수치) → 고정 필터 막대 → [기사 목록 | 오른쪽 현황 패널(우리 회사·주요 이슈·사고 유형·추이·키워드)]
   휴대폰에서는 '기사 / 현황' 탭으로 전환. 분류색은 ISO 7010 안전표지 색 체계를 따름 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#dde3e9; --grid:#e8ecf0;
  --accent:#1d4f91; --watch:#7a3fb0; --watch-bg:#f6f0fc; --new:#c8201e;
  --c-acc:#c8201e; --c-law:#1d5fa8; --c-hlt:#1f8a4c; --c-tech:#e2a400;
  --chip-on:#15202b; --chip-on-fg:#ffffff;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --tools-h:104px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1419; --surface:#171e26; --ink:#e6ebf0; --muted:#95a3b1; --line:#2a3440; --grid:#222b35;
  --accent:#7fb0ef; --watch:#c29af0; --watch-bg:#211a2c; --new:#f0625e;
  --c-acc:#e0514d; --c-law:#5a92d8; --c-hlt:#34a267; --c-tech:#c2861a;
  --chip-on:#e6ebf0; --chip-on-fg:#0f1419; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;border-bottom:3px solid var(--ink);padding-bottom:10px}
.brand h1{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.brand .sub{color:var(--muted);font-size:12px}
.kpis{display:flex;flex-wrap:wrap;gap:8px;flex:1;justify-content:flex-end}
.kpi{display:flex;flex-direction:column;align-items:flex-start;min-width:96px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--accent)}
.kpi b{font-family:var(--f-mono);font-size:20px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.kpi.w b{color:var(--watch)}
.kpi.d b{color:var(--c-acc)}
.kpi.n b{color:var(--accent)}
.stamp{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.stamp b{color:var(--ink);font-weight:500}

/* 필터 막대 */
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:14.5px;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none}
select,.range input{font:inherit;font-size:13.5px;padding:8px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%}
.range{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.range span{color:var(--muted)}
.btn{font-size:13.5px;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none}
.chip{font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip .n{font-family:var(--f-mono);font-size:11.5px;opacity:.7}
.chip.w[aria-pressed="true"]{background:var(--watch);border-color:var(--watch);color:#fff}
.active{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.active button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 9px;cursor:pointer}
.active button::after{content:" ×";color:var(--muted)}
.active .clear{border:0;background:none;color:var(--accent);padding:1px 4px}
.active .clear::after{content:""}

.sig{width:10px;height:10px;flex:none;display:inline-block}
.sig.acc{border-radius:50%;background:var(--c-acc)}
.sig.law{border-radius:50%;background:var(--c-law)}
.sig.hlt{border-radius:2px;background:var(--c-hlt)}
.sig.tech{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c-tech)}

/* 본문 2단 */
.mtabs{display:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start;margin-top:4px}
.side{position:sticky;top:calc(var(--tools-h) + 8px);max-height:calc(100vh - var(--tools-h) - 16px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px 8px 0;scrollbar-width:thin}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel h3{font-size:14px;font-weight:800}
.panel .note{font-size:11.5px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:12px;font-weight:500;white-space:nowrap}
.linkbtn:hover{text-decoration:underline;text-underline-offset:3px}
.panel.watch{border-color:color-mix(in srgb,var(--watch) 45%,var(--line));background:linear-gradient(var(--watch-bg),var(--surface) 80%)}
.panel.watch h3{color:var(--watch)}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.mini li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line)}
.mini li:first-child{border-top:0;padding-top:0}
.mini .t{font-size:13px;font-weight:500;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.mini .t:hover{text-decoration:underline;text-underline-offset:3px}
.mini .m{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:2px}
.mini .m .pd{font-family:var(--f-mono)}
.empty-s{font-size:13px;color:var(--muted)}

/* 사고 유형 막대 */
.bars{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:0;padding:0;list-style:none}
.bars button{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) 22px;gap:6px;align-items:center;background:none;border:0;padding:3px 4px;border-radius:4px;cursor:pointer;text-align:left}
.bars button:hover{background:var(--grid)}
.bars button[aria-pressed="true"]{background:color-mix(in srgb,var(--c-acc) 14%,transparent)}
.bars .lb{font-size:12px;white-space:nowrap}
.bars .track{display:block;height:8px;background:var(--grid);border-radius:3px;overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--c-acc);border-radius:0 3px 3px 0}
.bars .v{font-family:var(--f-mono);font-size:11.5px;text-align:right;color:var(--muted)}
/* 추이 */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:11.5px;line-height:1.5;padding:5px 8px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip b{font-family:var(--f-mono);font-weight:500}
/* 키워드 */
.kw{display:flex;flex-wrap:wrap;gap:5px}
.kw button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:1px 7px;cursor:pointer;font-size:12.5px;display:inline-flex;gap:5px;align-items:baseline}
.kw button:hover{border-color:var(--accent)}
.kw .n{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.kw button.top{font-weight:600}

/* 기사 목록 */
.day-h{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;border-bottom:2px solid var(--ink)}
.day-h h2{font-size:15px;font-weight:800}
.day-h .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.day-h .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.item{padding:10px 0 10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;position:relative}
.item::before{content:"";position:absolute;left:0;top:14px}
.item.is-w{background:linear-gradient(90deg,var(--watch-bg),transparent 70%)}
.item .row1{display:flex;gap:8px;align-items:baseline}
.item .row1 .sig{transform:translateY(-1px)}
.item a.t{font-weight:600;font-size:15px;line-height:1.45;text-decoration:none}
.item a.t:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.item p.sum{margin:0 0 0 18px;color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:92ch;cursor:pointer}
.item p.sum.open{-webkit-line-clamp:unset;display:block}
.meta{margin-left:18px;font-size:11.5px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.meta .pd{font-family:var(--f-mono)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:3px;padding:0 5px;line-height:1.7;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.tag.w{color:var(--watch);border-color:color-mix(in srgb,var(--watch) 50%,transparent)}
.tag.new{color:#fff;background:var(--new);border-color:var(--new)}
.more{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 7px;font-size:11.5px;cursor:pointer;color:var(--accent);line-height:1.7}
.more[aria-expanded="true"]{border-color:var(--accent)}
.srcs{display:flex;flex-wrap:wrap;gap:4px 5px;margin-left:18px}
.srcs a{font-size:11.5px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:1.7;white-space:nowrap;background:var(--surface)}
.srcs a:hover{border-color:var(--accent)}
mark{background:color-mix(in srgb,var(--c-tech) 35%,transparent);color:inherit;border-radius:2px}
.loadmore{display:block;margin:16px auto 0;padding:9px 18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;margin-top:12px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

@media (max-width:960px){
  .tools{position:static}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;overflow:visible;padding:0}
  .mtabs{display:flex;gap:0;margin-top:8px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
  .mtabs button{flex:1;border:0;background:none;padding:8px;font-weight:600;font-size:13.5px;cursor:pointer}
  .mtabs button[aria-selected="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
  body[data-tab="list"] .side{display:none}
  body[data-tab="dash"] #listCol{display:none}
  .kpis{justify-content:flex-start}
  .stamp{text-align:left}
}
@media (max-width:560px){
  .kpi{min-width:0;flex:1 1 40%}
  .bars{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-tab="list">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>안전보건 뉴스룸</h1>
      <div class="sub">산업안전·산업보건 국내 뉴스 · 평일 8시~18시 매시간 자동 수집</div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="stamp" id="stamp">불러오는 중…</div>
  </header>

  <div class="tools" id="tools">
    <div class="row">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="키워드 검색 (예: 추락, 양형기준, MSDS)" autocomplete="off">
      </label>
      <select id="period" aria-label="기간">
        <option value="1">오늘</option>
        <option value="3">최근 3일</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="all">전체</option>
        <option value="custom">기간 직접 설정</option>
      </select>
      <div class="range" id="range" hidden>
        <input type="date" id="from" aria-label="시작일"><span>~</span><input type="date" id="to" aria-label="종료일">
      </div>
      <select id="region" aria-label="지역"></select>
      <button type="button" class="btn" id="csv" title="지금 조건의 기사 목록을 엑셀에서 열 수 있는 파일로 저장">
        <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>엑셀로 저장
      </button>
    </div>
    <div class="row" id="chips" role="group" aria-label="분류 필터"></div>
    <div class="active" id="active" hidden></div>
    <div class="mtabs" role="tablist">
      <button type="button" role="tab" data-tab="list" aria-selected="true">기사 목록</button>
      <button type="button" role="tab" data-tab="dash" aria-selected="false">현황</button>
    </div>
  </div>

  <div class="layout">
    <main id="listCol">
      <div id="list"><div class="empty"><b>뉴스를 불러오는 중입니다</b>평일 업무시간에 매시간 새 기사가 이곳에 쌓입니다.</div></div>
    </main>

    <aside class="side" id="side" aria-label="현황">
      <section class="panel watch" id="watch">
        <div class="panel-h"><h3 id="watchTitle">우리 회사 관련</h3><button type="button" class="linkbtn" id="watchAll">모두 보기</button></div>
        <div class="note">최근 30일 · 기사 제목에 계열사 이름이 나온 안전·노동 기사</div>
        <ol class="mini" id="watchList"></ol>
      </section>
      <section class="panel" id="brief" hidden>
        <div class="panel-h"><h3 id="briefTitle">여러 언론이 다룬 이슈</h3><span class="note" id="briefDate"></span></div>
        <ol class="mini" id="briefList"></ol>
      </section>
      <section class="panel">
        <div class="panel-h"><h3>사고 유형</h3><span class="note">누르면 해당 유형만</span></div>
        <ul class="bars" id="types"></ul>
      </section>
      <section class="panel">
        <div class="panel-h"><h3>분류별 기사 추이</h3><span class="note" id="trendNote"></span></div>
        <div class="chart" id="trend"></div>
        <div class="legend" id="legend"></div>
      </section>
      <section class="panel">
        <div class="panel-h"><h3>자주 나온 키워드</h3><span class="note">누르면 검색</span></div>
        <div class="kw" id="kw"></div>
      </section>
    </aside>
  </div>
</div>

<script>
const DEFAULT_CATS=[{id:"acc",label:"중대재해·사고"},{id:"law",label:"법령·정책"},{id:"hlt",label:"산업보건"},{id:"tech",label:"업계·기술 동향"}];
const TYPES=[
  {id:"fall",label:"추락",re:/추락|떨어짐|떨어져|낙상/},
  {id:"caught",label:"끼임",re:/끼임|끼여|끼어|협착|압착|말려/},
  {id:"crush",label:"깔림·붕괴",re:/깔림|깔려|붕괴|무너|매몰/},
  {id:"struck",label:"부딪힘",re:/부딪|충돌|치여|치어|낙하물|맞아 숨|맞아 사망|비래/},
  {id:"fire",label:"화재·폭발",re:/화재|폭발|화염|화상|불이 나/},
  {id:"asphyx",label:"질식·중독",re:/질식|중독|가스 누출|유해가스|일산화탄소|황화수소/},
  {id:"elec",label:"감전",re:/감전/},
  {id:"heat",label:"온열·한랭",re:/온열|열사병|폭염|한랭|저체온/}
];
const DEATH=/사망|숨져|숨진|목숨|사상자|심정지|순직/;
const REGIONS=[
  ["서울",/서울/],["부산",/부산/],["대구",/대구/],["인천",/인천/],["광주",/광주/],["대전",/대전/],["울산",/울산/],["세종",/세종시|세종특별/],
  ["경기",/경기|수원|성남|용인|화성|평택|안산|안양|부천|고양|파주|김포|시흥|이천|광명|의정부|남양주|오산|안성|하남|여주|포천|군포/],
  ["강원",/강원|춘천|원주|강릉|삼척|속초|태백|철원/],
  ["충북",/충북|충청북도|청주|충주|제천|진천/],
  ["충남",/충남|충청남도|천안|아산|당진|서산|보령|논산|태안/],
  ["전북",/전북|전라북도|전주|군산|익산|정읍/],
  ["전남",/전남|전라남도|여수|순천|목포|광양|나주|영암/],
  ["경북",/경북|경상북도|포항|구미|경주|안동|김천|영주|칠곡|경산/],
  ["경남",/경남|경상남도|창원|김해|거제|진주|양산|통영|사천|밀양|고성/],
  ["제주",/제주/]
];
const STOP=new Set("기자 뉴스 오늘 대한 관련 위해 통해 이후 올해 지난 개최 실시 강화 추진 발표 위한 있는 없는 한다 했다 밝혀 밝혔다 등 및 또 더 중 첫 전 후 간 년 명 건 대표 사업 현장 안전 산업안전 노동자 근로자 중대재해 사고 산재 산업재해 안전보건 예방 최근 내년 올해도 이번 가운데 속 나서 나선다 위해서 대상 확대 지원 운영 진행 계획 만에 결과 문제 필요 등의 단독 종합 기획 속보 포토".split(" "));
const PAGE=60;

const state={data:null,cats:DEFAULT_CATS,on:new Set(DEFAULT_CATS.map(c=>c.id)),q:"",period:"7",from:"",to:"",region:"",onlyWatch:false,type:"",death:false,onlyNew:false,shown:PAGE,tab:"list"};
let lastSeen="";
try{const p=localStorage.getItem("snr-period");if(p)state.period=p;lastSeen=localStorage.getItem("snr-seen")||"";}catch(e){}
const $=id=>document.getElementById(id);
$("period").value=state.period;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
function hl(text,q){const t=esc(text);if(!q)return t;const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(qq,"gi"),m=>`<mark>${m}</mark>`);}
const WD=["일","월","화","수","목","금","토"];
function fmtDay(d){const [y,m,dd]=d.split("-").map(Number);return `${m}월 ${dd}일 (${WD[new Date(Date.UTC(y,m-1,dd)).getUTCDay()]})`;}
const fmtShort=d=>{const [,m,dd]=d.split("-").map(Number);return `${m}/${dd}`;};
function todayKST(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
const addDays=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
function hhmm(iso){const t=(iso||"").slice(11,16);return t&&t!=="00:00"?t:"";}
const dayDiff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const catOf=id=>state.cats.find(c=>c.id===id)||{id:"",label:id||"기타"};
const watchLabel=()=>state.data?.watchLabel||"우리 회사";

function enrich(a){
  const text=a.title+" "+(a.summary||"");
  a._types=TYPES.filter(t=>t.re.test(text)).map(t=>t.id);
  a._regions=REGIONS.filter(([,re])=>re.test(text)).map(([n])=>n);
  a._death=DEATH.test(a.title);
  a._search=[a.title,a.summary,a.source,...(a.related||[]).map(r=>r.source+" "+(r.title||""))].join(" ").toLowerCase();
  a._new=!!lastSeen&&(a.published||"")>lastSeen;
  a.watch=a.watch||[];
}
function articles(){return state.data?.articles||[];}
function range(){
  const t=todayKST();
  if(state.period==="all"){const days=articles().map(a=>a.day).sort();return [days[0]||t,t];}
  if(state.period==="custom")return [state.from||"0000-00-00",state.to||t];
  return [addDays(t,1-Number(state.period)),t];
}
function base(a,skip={}){
  if(!skip.period){const [f,t]=range();if(a.day<f||a.day>t)return false;}
  if(state.q&&!a._search.includes(state.q.toLowerCase()))return false;
  if(!skip.region&&state.region&&!a._regions.includes(state.region))return false;
  if(state.onlyWatch&&!a.watch.length)return false;
  if(state.death&&!a._death)return false;
  if(state.onlyNew&&!a._new)return false;
  if(!skip.type&&state.type&&!a._types.includes(state.type))return false;
  return true;
}
const visible=()=>articles().filter(a=>base(a)&&state.on.has(a.cat));

const allSrc=a=>[{source:a.source,url:a.url},...(a.related||[])];
const srcLinks=a=>allSrc(a).map(r=>`<a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${hl(r.source,state.q)}</a>`).join("");
const watchTags=a=>[...new Set(a.watch)].slice(0,2).map(n=>`<span class="tag w">${esc(n)}</span>`).join("");

/* ---------- 상단 ---------- */
function renderTop(){
  const d=state.data;if(!d)return;
  $("stamp").innerHTML=`최근 수집 <b>${esc((d.updatedAt||"").replace("T"," ").slice(5,16))}</b><br>보관 ${articles().length}건`;
  const t=todayKST();
  const today=articles().filter(a=>a.day===t);
  const w30=articles().filter(a=>a.watch.length&&a.day>=addDays(t,-29)).length;
  const deathToday=today.filter(a=>a._death&&a.cat==="acc").length;
  const nNew=articles().filter(a=>a._new).length;
  $("kpis").innerHTML=
    `<button type="button" class="kpi" data-k="today"><b>${today.length}</b><span>오늘 기사</span></button>`+
    `<button type="button" class="kpi d" data-k="death"><b>${deathToday}</b><span>오늘 사망사고 기사</span></button>`+
    `<button type="button" class="kpi w" data-k="watch"><b>${w30}</b><span>${esc(watchLabel())} 관련 30일</span></button>`+
    (lastSeen?`<button type="button" class="kpi n" data-k="new"><b>${nNew}</b><span>지난 방문 후 새 기사</span></button>`:"");
}
/* ---------- 오른쪽 패널 ---------- */
function renderWatch(){
  $("watchTitle").textContent=`${watchLabel()} 관련`;
  const list=articles().filter(a=>a.watch.length&&a.day>=addDays(todayKST(),-29)).slice(0,6);
  $("watchAll").hidden=!list.length;
  $("watchList").innerHTML=list.length?list.map(a=>`<li><span class="sig ${esc(a.cat)}" title="${esc(catOf(a.cat).label)}"></span><div><a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.title)}</a><div class="m"><span class="pd">${fmtShort(a.day)}</span>${watchTags(a)}<span>${esc(a.source)}${a.related?.length?` 외 ${a.related.length}`:""}</span></div></div></li>`).join("")
    :`<li class="empty-s">최근 30일 동안 관련 기사가 없습니다.</li>`;
}
function renderBrief(){
  const h=state.data?.highlights||[];
  if(!h.length){$("brief").hidden=true;return;}
  $("brief").hidden=false;
  $("briefTitle").textContent=h.some(x=>x.count>1)?"여러 언론이 다룬 이슈":"최근 주요 기사";
  $("briefDate").textContent=h[0].day?fmtDay(h[0].day):"";
  const byId=new Map(articles().map(a=>[a.id,a]));
  $("briefList").innerHTML=h.map(x=>{
    const a=byId.get(x.id)||{source:x.source,url:x.url,related:[],watch:[],id:x.id};
    const n=allSrc(a).length;
    return `<li><span class="sig ${esc(x.cat)}" title="${esc(catOf(x.cat).label)}"></span><div><a class="t" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="m">${watchTags(a)}${n>1?`<button type="button" class="more" aria-expanded="false" data-src="${esc(a.id)}">${n}개 언론 ▾</button>`:`<span>${esc(a.source)}</span>`}</div><div class="srcs" data-srcs="${esc(a.id)}" hidden style="margin:4px 0 0">${srcLinks(a)}</div></div></li>`;
  }).join("");
}
function renderTypes(){
  const rows=articles().filter(a=>base(a,{type:1})&&state.on.has(a.cat));
  const n=Object.fromEntries(TYPES.map(t=>[t.id,0]));rows.forEach(a=>a._types.forEach(t=>n[t]++));
  const max=Math.max(1,...Object.values(n));
  $("types").innerHTML=TYPES.map(t=>`<li><button type="button" data-type="${t.id}" aria-pressed="${state.type===t.id}"><span class="lb">${t.label}</span><span class="track"><span class="fill" style="width:${(n[t.id]/max*100).toFixed(1)}%"></span></span><span class="v">${n[t.id]}</span></button></li>`).join("");
}
function renderTrend(){
  const rows=visible();
  let [f,t]=range();const span=dayDiff(t,f)+1;
  if(span<14)f=addDays(t,-13);           // 짧은 기간이어도 흐름이 보이게 최소 14일
  if(span>30)f=addDays(t,-29);
  const days=[];for(let d=f;d<=t;d=addDays(d,1))days.push(d);
  $("trendNote").textContent=`최근 ${days.length}일`;
  const cats=state.cats.filter(c=>state.on.has(c.id));
  // 추이는 기간 선택과 관계없이 최소 14일·최대 30일을 보여 주고, 나머지 필터는 그대로 적용
  const src=articles().filter(a=>a.day>=f&&a.day<=t&&base(a,{period:1})&&state.on.has(a.cat));
  const cnt=Object.fromEntries(days.map(d=>[d,Object.fromEntries(cats.map(c=>[c.id,0]))]));
  src.forEach(a=>{if(cnt[a.day]&&cnt[a.day][a.cat]!==undefined)cnt[a.day][a.cat]++;});
  const tot=d=>cats.reduce((s,c)=>s+cnt[d][c.id],0);
  const maxV=Math.max(1,...days.map(tot));
  const niceMax=maxV<=5?5:maxV<=10?10:maxV<=20?20:Math.ceil(maxV/20)*20;
  const W=340,H=120,L=24,R=4,T=6,B=18,pw=W-L-R,ph=H-T-B;
  const step=pw/days.length,bw=Math.max(2,Math.min(18,step-2));
  let g="";
  [0,niceMax/2,niceMax].forEach(v=>{const y=T+ph-(v/niceMax)*ph;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text class="ax" x="${L-4}" y="${y+3}" text-anchor="end">${v}</text>`;});
  days.forEach((d,i)=>{
    const x=L+i*step+(step-bw)/2;let y=T+ph;
    cats.forEach(c=>{const v=cnt[d][c.id];if(!v)return;const h=v/niceMax*ph;y-=h;g+=`<rect x="${x.toFixed(1)}" y="${(y+1).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,h-2).toFixed(1)}" rx="1.5" fill="var(--c-${c.id})"/>`;});
    const lab=(days.length-1-i)%7===0||(i===0&&(days.length-1)%7>=3);
    if(lab)g+=`<text class="ax" x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle">${fmtShort(d)}</text>`;
    g+=`<rect class="hit" data-d="${d}" x="${(L+i*step).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ph}" fill="transparent"/>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${T+ph}" y2="${T+ph}" stroke="var(--muted)" stroke-opacity=".5"/>`;
  $("trend").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="날짜별 분류별 기사 수">${g}</svg><div class="tip" hidden></div>`;
  $("legend").innerHTML=cats.map(c=>`<span><i class="sig ${c.id}"></i>${esc(c.label)}</span>`).join("");
  const tip=$("trend").querySelector(".tip");
  $("trend").querySelectorAll(".hit").forEach(r=>{
    r.addEventListener("mouseenter",()=>{
      const d=r.dataset.d,box=$("trend").getBoundingClientRect(),rb=r.getBoundingClientRect();
      tip.innerHTML=`${fmtDay(d)} · <b>${tot(d)}</b>건<br>`+cats.map(c=>`${esc(c.label)} <b>${cnt[d][c.id]}</b>`).join(" · ");
      tip.hidden=false;
      tip.style.left=Math.min(Math.max(rb.left-box.left+rb.width/2,110),box.width-110)+"px";tip.style.top=(rb.top-box.top+4)+"px";
    });
    r.addEventListener("mouseleave",()=>tip.hidden=true);
  });
}
function renderKeywords(){
  const n=new Map();
  visible().forEach(a=>{
    const seen=new Set();
    a.title.replace(/[\[\(【][^\]\)】]*[\]\)】]/g," ").split(/[^0-9A-Za-z가-힣]+/).forEach(w=>{
      w=w.replace(/(으로|에서|에게|까지|부터|이며|하고|했다|한다|하는|으며|이다|은|는|이|가|을|를|에|의|로|과|와|도|만)$/,"");
      if(w.length<2||/^\d/.test(w)||STOP.has(w)||seen.has(w))return;
      seen.add(w);n.set(w,(n.get(w)||0)+1);
    });
  });
  const top=[...n.entries()].filter(([,c])=>c>=2).sort((a,b)=>b[1]-a[1]).slice(0,20);
  $("kw").innerHTML=top.length?top.map(([w,c],i)=>`<button type="button" data-kw="${esc(w)}" class="${i<5?"top":""}">${esc(w)}<span class="n">${c}</span></button>`).join(""):`<span class="empty-s">기사가 더 쌓이면 표시됩니다.</span>`;
}
/* ---------- 필터 막대 ---------- */
function renderRegions(){
  const n={};articles().filter(a=>base(a,{region:1})&&state.on.has(a.cat)).forEach(a=>a._regions.forEach(r=>n[r]=(n[r]||0)+1));
  $("region").innerHTML=`<option value="">전체 지역</option>`+REGIONS.map(([r])=>`<option value="${r}">${r} (${n[r]||0})</option>`).join("");
  $("region").value=state.region;
}
function renderChips(){
  const b=articles().filter(a=>base(a));const n={};b.forEach(a=>n[a.cat]=(n[a.cat]||0)+1);
  const wn=articles().filter(a=>base(a)&&state.on.has(a.cat)&&a.watch.length).length;
  $("chips").innerHTML=state.cats.map(c=>`<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${state.on.has(c.id)}"><span class="sig ${esc(c.id)}"></span>${esc(c.label)}<span class="n">${n[c.id]||0}</span></button>`).join("")
    +`<button type="button" class="chip w" id="onlyWatch" aria-pressed="${state.onlyWatch}">${esc(watchLabel())}만<span class="n">${state.onlyWatch?"":wn}</span></button>`;
}
function renderActive(){
  const bits=[];
  if(state.onlyNew)bits.push(`<button type="button" data-clear="onlyNew">지난 방문 후 새 기사</button>`);
  if(state.death)bits.push(`<button type="button" data-clear="death">사망사고 기사</button>`);
  if(state.type)bits.push(`<button type="button" data-clear="type">사고 유형: ${esc(TYPES.find(t=>t.id===state.type).label)}</button>`);
  if(state.region)bits.push(`<button type="button" data-clear="region">지역: ${esc(state.region)}</button>`);
  if(state.q)bits.push(`<button type="button" data-clear="q">검색: ${esc(state.q)}</button>`);
  const catOff=state.on.size!==state.cats.length;
  $("active").hidden=!(bits.length||catOff||state.onlyWatch);
  $("active").innerHTML=`<span>적용 중</span>${bits.join("")}<button type="button" class="clear" id="clearAll">모두 해제</button>`;
}
/* ---------- 기사 목록 ---------- */
function renderList(){
  if(!state.data)return;
  if(!articles().length){$("list").innerHTML=`<div class="empty"><b>아직 수집된 뉴스가 없습니다</b>평일 업무시간에 매시간 새 기사가 이곳에 쌓입니다.</div>`;return;}
  const rows=visible();
  if(!rows.length){$("list").innerHTML=`<div class="empty"><b>조건에 맞는 기사가 없습니다</b>검색어나 필터를 풀거나 기간을 넓혀 보세요.</div>`;return;}
  const order=Object.fromEntries(state.cats.map((c,i)=>[c.id,i]));
  rows.sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:(b.watch.length?1:0)-(a.watch.length?1:0)||(order[a.cat]??9)-(order[b.cat]??9)||(a.published<b.published?1:-1));
  const dayCount={};rows.forEach(a=>dayCount[a.day]=(dayCount[a.day]||0)+1);
  const shown=rows.slice(0,state.shown);
  let html="",cur="";
  shown.forEach(a=>{
    if(a.day!==cur){cur=a.day;html+=`<div class="day-h"><h2>${fmtDay(a.day)}</h2><span class="d">${a.day}</span><span class="cnt">${dayCount[a.day]}건</span></div>`;}
    const c=catOf(a.cat),n=allSrc(a).length;
    html+=`<article class="item${a.watch.length?" is-w":""}">
      <div class="row1"><span class="sig ${esc(c.id)}" title="${esc(c.label)}" aria-label="${esc(c.label)}"></span><a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${hl(a.title,state.q)}</a></div>
      ${a.summary?`<p class="sum" title="눌러서 펼치기">${hl(a.summary,state.q)}</p>`:""}
      <div class="meta">${a._new?`<span class="tag new">새 기사</span>`:""}${watchTags(a)}${hhmm(a.published)?`<span class="pd">${hhmm(a.published)}</span>`:""}<span>${hl(a.source,state.q)}</span>${n>1?`<button type="button" class="more" aria-expanded="false" data-src="${esc(a.id)}">외 ${n-1}개 언론 ▾</button>`:""}${a._regions.slice(0,2).map(r=>`<span class="tag">${r}</span>`).join("")}${a._types.slice(0,2).map(t=>`<span class="tag">${TYPES.find(x=>x.id===t).label}</span>`).join("")}</div>
      ${n>1?`<div class="srcs" data-srcs="${esc(a.id)}" hidden>${srcLinks(a)}</div>`:""}
    </article>`;
  });
  if(rows.length>state.shown)html+=`<button type="button" class="btn loadmore" id="loadMore">기사 ${Math.min(PAGE,rows.length-state.shown)}건 더 보기 (${state.shown}/${rows.length})</button>`;
  $("list").innerHTML=html;
}
function renderFiltered(){state.shown=PAGE;renderRegions();renderChips();renderActive();renderTypes();renderTrend();renderKeywords();renderList();measureTools();}

window.addEventListener("resize",measureTools);

/* ---------- 엑셀(CSV) 저장 ---------- */
function csvCell(v){v=String(v??"");return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
$("csv").addEventListener("click",()=>{
  const rows=visible();
  const head=["날짜","시각","분류","제목","대표 언론사","링크","보도 언론 수","다른 언론사",`${watchLabel()} 관련`,"지역","사고 유형","요약"];
  const lines=[head.map(csvCell).join(",")].concat(rows.map(a=>[
    a.day,hhmm(a.published),catOf(a.cat).label,a.title,a.source,a.url,allSrc(a).length,(a.related||[]).map(r=>r.source).join(" / "),
    [...new Set(a.watch)].join(" / "),a._regions.join(" / "),a._types.map(t=>TYPES.find(x=>x.id===t).label).join(" / "),a.summary||""
  ].map(csvCell).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const [f,t]=range();
  const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=`안전보건뉴스_${f}_${t}.csv`;
  document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(link.href);link.remove();},1000);
});

/* ---------- 조작 ---------- */
function syncRange(){
  $("range").hidden=state.period!=="custom";
  if(state.period==="custom"){
    const days=articles().map(a=>a.day).sort();const min=days[0]||"",max=todayKST();
    for(const id of ["from","to"]){$(id).min=min;$(id).max=max;}
    if(!state.to)state.to=max;
    if(!state.from){const d=addDays(max,-6);state.from=min&&d<min?min:d;}
    $("from").value=state.from;$("to").value=state.to;
  }
}
function setPeriod(p){state.period=p;$("period").value=p;try{localStorage.setItem("snr-period",p)}catch(_){}syncRange();}
function resetFilters(){Object.assign(state,{q:"",region:"",onlyWatch:false,type:"",death:false,onlyNew:false});state.on=new Set(state.cats.map(c=>c.id));$("q").value="";}
function toList(){setTab("list");window.scrollTo({top:$("tools").offsetTop,behavior:"smooth"});}
function setTab(t){state.tab=t;document.body.dataset.tab=t;document.querySelectorAll(".mtabs [data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));}

let qTimer;
$("q").addEventListener("input",e=>{clearTimeout(qTimer);qTimer=setTimeout(()=>{state.q=e.target.value.trim();renderFiltered();},150);});
$("period").addEventListener("change",e=>{setPeriod(e.target.value);renderFiltered();});
for(const id of ["from","to"])$(id).addEventListener("change",()=>{
  state.from=$("from").value;state.to=$("to").value;
  if(state.from&&state.to&&state.from>state.to){[state.from,state.to]=[state.to,state.from];$("from").value=state.from;$("to").value=state.to;}
  renderFiltered();
});
$("region").addEventListener("change",e=>{state.region=e.target.value;renderFiltered();});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(b.id==="onlyWatch"){state.onlyWatch=!state.onlyWatch;renderFiltered();return;}
  const id=b.dataset.cat,all=state.cats.map(c=>c.id);
  if(state.on.has(id)&&state.on.size===all.length)state.on=new Set([id]);
  else if(state.on.has(id)){state.on.delete(id);if(!state.on.size)state.on=new Set(all);}
  else state.on.add(id);
  renderFiltered();
});
$("active").addEventListener("click",e=>{
  if(e.target.id==="clearAll"){resetFilters();renderFiltered();return;}
  const k=e.target.dataset?.clear;if(!k)return;
  state[k]=typeof state[k]==="boolean"?false:"";if(k==="q")$("q").value="";renderFiltered();
});
$("kpis").addEventListener("click",e=>{
  const k=e.target.closest("[data-k]")?.dataset.k;if(!k)return;
  resetFilters();
  if(k==="today")setPeriod("1");
  if(k==="death"){setPeriod("1");state.death=true;state.on=new Set(["acc"]);}
  if(k==="watch"){setPeriod("30");state.onlyWatch=true;}
  if(k==="new"){setPeriod("all");state.onlyNew=true;}
  renderFiltered();toList();
});
$("types").addEventListener("click",e=>{const b=e.target.closest("[data-type]");if(!b)return;state.type=state.type===b.dataset.type?"":b.dataset.type;renderFiltered();if(state.type)toList();});
$("kw").addEventListener("click",e=>{const b=e.target.closest("[data-kw]");if(!b)return;state.q=b.dataset.kw;$("q").value=state.q;renderFiltered();toList();});
$("watchAll").addEventListener("click",()=>{resetFilters();state.onlyWatch=true;setPeriod("30");renderFiltered();toList();});
document.addEventListener("click",e=>{
  const m=e.target.closest(".more[data-src]");
  if(m){const scope=m.closest("li,article").querySelector("[data-srcs]");const open=scope.hidden;scope.hidden=!open;m.setAttribute("aria-expanded",open);m.textContent=m.textContent.replace(open?"▾":"▴",open?"▴":"▾");return;}
  const s=e.target.closest("p.sum");if(s){s.classList.toggle("open");return;}
  if(e.target.id==="loadMore"){state.shown+=PAGE;renderList();}
  const tb=e.target.closest(".mtabs [data-tab]");if(tb)setTab(tb.dataset.tab);
});

async function load(){
  try{
    const r=await fetch("data/news.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    (d.articles||[]).forEach(enrich);
    const keepShown=state.data?state.shown:PAGE;
    state.data=d;
    if(Array.isArray(d.categories)&&d.categories.length){
      const ids=d.categories.map(c=>c.id);
      if(ids.join()!==state.cats.map(c=>c.id).join()){state.cats=d.categories;state.on=new Set(ids);}
    }
    syncRange();renderAll();state.shown=keepShown;if(keepShown!==PAGE)renderList();
  }catch(e){
    if(!state.data){$("stamp").textContent="불러오기 실패";$("list").innerHTML=`<div class="empty"><b>뉴스 데이터를 불러오지 못했습니다</b>data/news.json 파일이 있는지 확인하고 새로고침해 주세요.</div>`;}
  }
}
// 이번 방문 시각을 기록 (다음 방문 때 '새 기사' 표시 기준). 페이지를 닫을 때 저장
function markSeen(){try{const newest=articles().reduce((m,a)=>a.published>m?a.published:m,"");if(newest)localStorage.setItem("snr-seen",newest);}catch(e){}}
window.addEventListener("pagehide",markSeen);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")markSeen();});

load();
setInterval(load,10*60*1000); // 10분마다 새 기사 확인
</script>
