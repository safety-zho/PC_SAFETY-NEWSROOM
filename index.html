<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>안전보건 뉴스룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 분류색은 ISO 7010 안전표지 색 체계: 빨강(금지·위험) 파랑(지시) 초록(안전상태) 노랑(경고) */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#dde3e9;
  --accent:#1d4f91;
  --c-acc:#c8201e; --c-law:#1d5fa8; --c-hlt:#1f8a4c; --c-tech:#e2a400;
  --chip-on:#15202b; --chip-on-fg:#ffffff;
  --f-display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1419; --surface:#171e26; --ink:#e6ebf0; --muted:#95a3b1; --line:#2a3440;
  --accent:#7fb0ef; --c-acc:#f0625e; --c-law:#6fa6ea; --c-hlt:#4cc07f; --c-tech:#f2c23a;
  --chip-on:#e6ebf0; --chip-on-fg:#0f1419; color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0}
a{color:inherit}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:3px solid var(--ink);padding-bottom:12px}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:13px}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.stamp b{color:var(--ink);font-weight:500}

.brief{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.brief .eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;gap:10px;align-items:center}
.brief .eyebrow .d{font-family:var(--f-mono);letter-spacing:0;color:var(--ink)}
.brief h2{font-size:19px;font-weight:800}
.brief ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.brief li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.brief li:first-child{border-top:0}
.brief li a{text-decoration:none;font-weight:500}
.brief li a:hover{text-decoration:underline;text-underline-offset:3px}
.cnt-badge{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.cnt-badge b{color:var(--ink);font-weight:500}

.tools{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none}
select{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.chip{font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);border-color:var(--chip-on)}
.chip .n{font-family:var(--f-mono);font-size:12px;opacity:.7}

.sig{width:11px;height:11px;flex:none;display:inline-block}
.sig.acc{border-radius:50%;background:var(--c-acc)}
.sig.law{border-radius:50%;background:var(--c-law)}
.sig.hlt{border-radius:2px;background:var(--c-hlt)}
.sig.tech{width:0;height:0;border-left:6.5px solid transparent;border-right:6.5px solid transparent;border-bottom:11px solid var(--c-tech)}

.day-h{display:flex;align-items:baseline;gap:10px;padding-block:14px 6px}
.day-h h2{font-size:16px;font-weight:800}
.day-h .d{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.day-h .cnt{margin-left:auto;font-size:12px;color:var(--muted)}

.item{display:grid;grid-template-columns:112px minmax(0,1fr);gap:4px 16px;padding:14px 0;border-top:1px solid var(--line)}
.cat{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding-top:3px}
.body{min-width:0;display:flex;flex-direction:column;gap:4px}
.body a.t{color:var(--ink);font-weight:600;font-size:16px;line-height:1.45;text-decoration:none}
.body a.t:hover{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.body p{margin:0;color:var(--muted);font-size:14px;max-width:72ch}
.meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.meta .pd{font-family:var(--f-mono)}
details.rel summary{cursor:pointer;color:var(--accent)}
details.rel ul{margin:4px 0 0;padding-left:1.1em}
details.rel li a{color:var(--muted)}
mark{background:color-mix(in srgb,var(--c-tech) 35%,transparent);color:inherit;border-radius:2px}

.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

@media (max-width:560px){
  .item{grid-template-columns:minmax(0,1fr)}
  header.top h1{font-size:22px}
  .stamp{text-align:left}
  .brief li{grid-template-columns:auto minmax(0,1fr)}
  .brief li .cnt-badge{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>안전보건 뉴스룸</h1>
      <div class="sub">산업안전·산업보건 국내 뉴스 · 평일 8시~18시 매시간 자동 수집</div>
    </div>
    <div class="stamp" id="stamp">불러오는 중…</div>
  </header>

  <section class="brief" id="brief" hidden>
    <div class="eyebrow">주요 이슈 <span class="d" id="briefDate"></span></div>
    <h2 id="briefTitle">여러 언론이 함께 다룬 기사</h2>
    <ol id="briefList"></ol>
  </section>

  <div class="tools">
    <div class="row">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="키워드 검색 (예: 추락, 양형기준, MSDS)" autocomplete="off">
      </label>
      <select id="period" aria-label="기간">
        <option value="1">오늘</option>
        <option value="7" selected>최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="all">전체</option>
      </select>
    </div>
    <div class="row" id="chips" role="group" aria-label="분류 필터"></div>
  </div>

  <main id="list">
    <div class="empty"><b>뉴스를 불러오는 중입니다</b>평일 업무시간에 매시간 새 기사가 이곳에 쌓입니다.</div>
  </main>
</div>

<script>
const DEFAULT_CATS=[{id:"acc",label:"중대재해·사고"},{id:"law",label:"법령·정책"},{id:"hlt",label:"산업보건"},{id:"tech",label:"업계·기술 동향"}];
const state={data:null,cats:DEFAULT_CATS,on:new Set(DEFAULT_CATS.map(c=>c.id)),q:"",period:"7"};
try{const p=localStorage.getItem("snr-period");if(p)state.period=p;}catch(e){}
const $=id=>document.getElementById(id);
$("period").value=state.period;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
function hl(text,q){const t=esc(text);if(!q)return t;const qq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return t.replace(new RegExp(qq,"gi"),m=>`<mark>${m}</mark>`);}
const WD=["일","월","화","수","목","금","토"];
function fmtDay(d){const [y,m,dd]=d.split("-").map(Number);return `${m}월 ${dd}일 (${WD[new Date(Date.UTC(y,m-1,dd)).getUTCDay()]})`;}
function todayKST(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
function hhmm(iso){const t=(iso||"").slice(11,16);return t&&t!=="00:00"?t:"";}
const dayDiff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);

function articles(){return state.data?.articles||[];}
function inPeriod(a){return state.period==="all"||dayDiff(todayKST(),a.day)<Number(state.period);}
function matchesQ(a){
  if(!state.q)return true;const q=state.q.toLowerCase();
  return [a.title,a.summary,a.source,...(a.related||[]).map(r=>r.source)].some(v=>String(v||"").toLowerCase().includes(q));
}
const catOf=id=>state.cats.find(c=>c.id===id)||{id:"",label:id||"기타"};

function renderStamp(){
  const d=state.data;if(!d){return;}
  const t=(d.updatedAt||"").replace("T"," ").slice(0,16);
  $("stamp").innerHTML=`최근 수집 <b>${esc(t)}</b><br>보관 ${articles().length}건`;
}
function renderBrief(){
  const h=state.data?.highlights||[];
  if(!h.length){$("brief").hidden=true;return;}
  $("brief").hidden=false;$("briefTitle").textContent=h.some(x=>x.count>1)?"여러 언론이 함께 다룬 기사":"최근 주요 기사";$("briefDate").textContent=h[0].day?fmtDay(h[0].day):"";
  $("briefList").innerHTML=h.map(x=>`<li><span class="sig ${esc(x.cat)}" title="${esc(catOf(x.cat).label)}"></span><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="cnt-badge">${x.count>1?`<b>${x.count}</b>개 언론`:esc(x.source)}</span></li>`).join("");
}
function renderChips(){
  const base=articles().filter(a=>inPeriod(a)&&matchesQ(a));const n={};base.forEach(a=>n[a.cat]=(n[a.cat]||0)+1);
  $("chips").innerHTML=state.cats.map(c=>`<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${state.on.has(c.id)}"><span class="sig ${esc(c.id)}"></span>${esc(c.label)}<span class="n">${n[c.id]||0}</span></button>`).join("");
}
function renderList(){
  if(!state.data){return;}
  const rows=articles().filter(a=>inPeriod(a)&&state.on.has(a.cat)&&matchesQ(a));
  if(!articles().length){$("list").innerHTML=`<div class="empty"><b>아직 수집된 뉴스가 없습니다</b>평일 업무시간에 매시간 새 기사가 이곳에 쌓입니다.</div>`;return;}
  if(!rows.length){$("list").innerHTML=`<div class="empty"><b>조건에 맞는 기사가 없습니다</b>검색어를 바꾸거나 기간을 넓혀 보세요.</div>`;return;}
  const groups=new Map();
  rows.forEach(a=>{if(!groups.has(a.day))groups.set(a.day,[]);groups.get(a.day).push(a);});
  const order=Object.fromEntries(state.cats.map((c,i)=>[c.id,i]));
  $("list").innerHTML=[...groups.entries()].sort((x,y)=>x[0]<y[0]?1:-1).map(([day,list])=>{
    list.sort((a,b)=>(order[a.cat]??9)-(order[b.cat]??9)||(a.published<b.published?1:-1));
    return `<section><div class="day-h"><h2>${fmtDay(day)}</h2><span class="d">${day}</span><span class="cnt">${list.length}건</span></div>`+list.map(a=>{
      const c=catOf(a.cat);const rel=a.related||[];
      return `<article class="item"><div class="cat"><span class="sig ${esc(c.id)}"></span>${esc(c.label)}</div><div class="body">
        <a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${hl(a.title,state.q)}</a>
        ${a.summary?`<p>${hl(a.summary,state.q)}</p>`:""}
        <div class="meta"><span>${hl(a.source,state.q)}</span>${hhmm(a.published)?`<span class="pd">${hhmm(a.published)}</span>`:""}
        ${rel.length?`<details class="rel"><summary>같은 사건 보도 ${rel.length}건 더</summary><ul>${rel.map(r=>`<li><a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">${esc(r.source)}</a></li>`).join("")}</ul></details>`:""}</div>
      </div></article>`;}).join("")+`</section>`;
  }).join("");
}
function renderAll(){renderStamp();renderBrief();renderChips();renderList();}

async function load(){
  try{
    const r=await fetch("data/news.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    state.data=d;
    if(Array.isArray(d.categories)&&d.categories.length){
      const ids=d.categories.map(c=>c.id);
      if(ids.join()!==state.cats.map(c=>c.id).join()){state.cats=d.categories;state.on=new Set(ids);}
    }
    renderAll();
  }catch(e){
    if(!state.data){$("stamp").textContent="불러오기 실패";$("list").innerHTML=`<div class="empty"><b>뉴스 데이터를 불러오지 못했습니다</b>data/news.json 파일이 있는지 확인하고 새로고침해 주세요.</div>`;}
  }
}

$("q").addEventListener("input",e=>{state.q=e.target.value.trim();renderChips();renderList();});
$("period").addEventListener("change",e=>{state.period=e.target.value;try{localStorage.setItem("snr-period",state.period)}catch(_){}renderChips();renderList();});
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;const id=b.dataset.cat;const all=state.cats.map(c=>c.id);
  if(state.on.has(id)&&state.on.size===all.length)state.on=new Set([id]);
  else if(state.on.has(id)){state.on.delete(id);if(!state.on.size)state.on=new Set(all);}
  else state.on.add(id);
  renderChips();renderList();
});

load();
setInterval(load,10*60*1000); // 10분마다 새 기사 확인
</script>
</body>
</html>
